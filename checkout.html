          <div class="form-field"><label id="lbl-nom">Nom *</label><input name="nom" required><span class="field-error"></span></div>
          <div class="form-field"><label id="lbl-prenom">Prénom *</label><input name="prenom" required><span class="field-error"></span></div>
          <div class="form-field"><label id="lbl-email">Email *</label><input type="email" name="email" required><span class="field-error"></span></div>
          <div class="form-field"><label id="lbl-telephone">Téléphone *</label><input name="telephone" placeholder="+33 6 12 34 56 78" required><span class="field-error"></span></div>
          <div class="form-field full"><label id="lbl-adresse">Adresse *</label><input name="adresse" required><span class="field-error"></span></div>
          <div class="form-field"><label id="lbl-cp">Code postal *</label><input name="codePostal" required><span class="field-error"></span></div>
          <div class="form-field"><label id="lbl-ville">Ville *</label><input name="ville" required><span class="field-error"></span></div>
          <div class="form-field full"><label id="lbl-pays">Pays *</label><select name="pays" required></select><span class="field-error"></span></div>
        </div>
        <label class="checkbox-row" id="cgv-row"></label>
        <span class="field-error" id="cgv-error"></span>
        <div style="margin-top:var(--space-4)">
          <button type="submit" class="btn btn-wa btn-block" id="checkout-submit">Envoyer ma commande via WhatsApp</button>
        </div>
        <div class="payment-methods" id="payment-methods">

          <p class="payment-secure-note">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>

      <aside class="order-summary glass-card">
        <h3 style="margin-bottom:var(--space-2)" id="summary-title">Résumé de commande</h3>

          <input class="search-field" id="promo-code">
          <button class="btn btn-outline btn-sm" id="apply-promo" type="button">Appliquer</button>
        </div>
        <div id="order-summary-lines" style="margin-top:var(--space-2)"></div>
        <p style="font-size:11px;color:var(--ink-soft);margin-top:var(--space-2)" id="checkout-note"></p>
